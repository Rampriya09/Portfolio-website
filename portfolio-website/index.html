<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | Frontend Developer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav>
        <div class="logo">DevName</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
        <button id="theme-toggle">🌙</button>
    </nav>

    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Hi, I'm <span class="highlight">Your Name</span></h1>
            <p>I build responsive, modern web experiences.</p>
            <div class="socials">
                <a href="#"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-linkedin"></i></a>
            </div>
        </div>
    </section>

    <section id="projects">
        <h2>My Work</h2>
        <div class="project-grid">
            <div class="project-card">
                <div class="project-img"></div>
                <h3>E-Commerce UI</h3>
                <p>A clean shopping experience built with Flexbox.</p>
                <a href="#" class="btn">View Project</a>
            </div>
            <div class="project-card">
                <div class="project-img"></div>
                <h3>Weather App</h3>
                <p>Real-time data fetching using Fetch API.</p>
                <a href="#" class="btn">View Project</a>
            </div>
        </div>
    </section>

    <section id="contact">
        <h2>Get In Touch</h2>
        <form id="contact-form">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <textarea id="message" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
            <p id="form-status"></p>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
